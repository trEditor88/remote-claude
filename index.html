<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원격 Claude</title>
<meta name="description" content="관리자 PC의 Claude Code에게 일을 시키고 결과를 받습니다.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* Light 하우스 토큰(.claude/웹사이트_제작_통합_프롬프트.md) */
:root{--canvas:#FFFFFF;--parchment:#F5F5F7;--ink:#1D1D1F;--muted:#6E6E73;--border:#E0E0E0;--blue:#0066CC;--blue-focus:#0071E3;--green:#15803D;--red:#C0392B;--warn:#9A6700;--soft:#ECECEF;--on-blue:#FFFFFF;--r-md:11px;--r-lg:18px;--r-pill:9999px}
@media (prefers-color-scheme: dark){:root{--canvas:#000000;--parchment:#1C1C1E;--ink:#F5F5F7;--muted:#A1A1A6;--border:#3A3A3C;--blue:#4A9EFF;--blue-focus:#4A9EFF;--green:#4CC38A;--red:#FF6B5B;--warn:#E0A526;--soft:#2C2C2E;--on-blue:#000000}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
@media (min-width:768px){.wrap{padding:48px 24px 96px}}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-0.02em;margin:0}
.lead{color:var(--muted);font-size:15.5px;margin:4px 0 0}
.panel{background:var(--parchment);border-radius:var(--r-lg);padding:20px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
select{min-height:48px;padding-right:36px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;text-overflow:ellipsis}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-focus);outline-offset:2px}
.field{margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:var(--r-pill);background:var(--blue);color:var(--on-blue);font-size:16px;font-weight:700;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn2{min-height:48px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--canvas);color:var(--blue);font-size:15px;font-weight:700;padding:10px 18px;white-space:nowrap;flex-shrink:0}
.row{display:flex;gap:8px;align-items:center}
.row select{flex:1;min-width:0}
.link{background:none;border:0;color:var(--blue);font-size:15px;font-weight:600;padding:10px 4px;min-height:44px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 12px}
.msg{font-size:14.5px;margin:12px 0 0}
.msg.bad{color:var(--red)} .msg.warn{color:var(--warn)}
h2{font-size:19px;font-weight:700;margin:32px 0 12px;overflow-wrap:anywhere}
.list{display:grid;gap:12px;margin-bottom:20px}
.item{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:var(--r-pill);padding:2px 10px;background:var(--soft);color:var(--ink)}
.badge.running{background:var(--blue);color:var(--on-blue)} .badge.done{color:var(--green)} .badge.error{color:var(--red)}
.prompt{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.result{margin-top:12px;background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto}
.result.err{color:var(--red)}
.empty{color:var(--muted);font-size:15px}
.who{font-size:14px;color:var(--muted);display:flex;align-items:center;white-space:nowrap;flex-shrink:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>원격 Claude</h1>
      <p class="lead">관리자 PC의 Claude Code에게 일을 시키고 결과를 받습니다.</p>
    </div>
    <div id="who" class="who" hidden></div>
  </header>

  <!-- 로그인 -->
  <section id="login" class="panel" hidden>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label for="uid">아이디</label><input type="text" id="uid" autocomplete="username" required></div>
      <div class="field"><label for="upw">비밀번호</label><input type="password" id="upw" autocomplete="current-password" required></div>
      <button class="btn" id="loginBtn" type="submit">들어가기</button>
      <p class="msg bad" id="loginMsg" role="alert" hidden></p>
    </form>
    <p class="msg" style="color:var(--muted)">시험지 사이트의 관리자 계정으로 들어갑니다.</p>
  </section>

  <!-- 대화 -->
  <section id="app" hidden>
    <div class="panel">
      <label for="conv">대화</label>
      <div class="row">
        <select id="conv" aria-describedby="convHint"></select>
        <button class="btn2" id="newConv" type="button">새 대화</button>
      </div>
      <p class="hint" id="convHint" style="margin-bottom:0">대화마다 Claude가 따로 기억합니다. 다른 일을 시킬 때는 새 대화로 시작하세요.</p>
      <p class="msg warn" id="stale" role="alert" hidden>1분 넘게 기다리는 요청이 있습니다. PC가 꺼져 있거나 <code>python tools\remote_claude.py</code> 가 멈췄을 수 있습니다.</p>
    </div>

    <h2 id="title">새 대화</h2>
    <div class="list" id="list" aria-live="polite"><p class="empty">불러오는 중…</p></div>

    <div class="panel">
      <label for="prompt">요청</label>
      <textarea id="prompt" maxlength="4000" placeholder="예: 시험지 사이트 상태 점검해 줘 / reports 폴더의 최신 리포트 요약해 줘"></textarea>
      <p class="hint" id="sendHint">새 대화로 보냅니다.</p>
      <button class="btn" id="send" disabled>보내기</button>
      <p class="msg" id="sendMsg" role="status" hidden></p>
    </div>
  </section>
</div>
<script>
(function () {
  "use strict";
  var KEY = "remote-claude:auth", TKEY = "remote-claude:thread";
  var API = "https://exam-api.dawn-sea-4052.workers.dev";
  try { API = localStorage.getItem("remote-claude:api") || API; } catch (e) {}   // 로컬 시험용(wrangler dev)
  var ST = { queued: "대기", running: "실행 중", done: "완료", error: "오류" };
  var ERR = { bad_login: "아이디 또는 비밀번호가 맞지 않습니다.", locked: "로그인을 너무 많이 틀려 잠시 잠겼습니다. 15분 뒤 다시 시도해 주세요.", forbidden: "관리자 계정만 쓸 수 있습니다.", rc_busy: "처리를 기다리는 요청이 이미 3개 있습니다. 끝난 뒤 다시 보내 주세요.", network: "인터넷 연결을 확인해 주세요.", timeout: "서버 응답이 너무 늦습니다.", server: "서버 오류가 났습니다. 잠시 뒤 다시 시도해 주세요." };
  var $ = function (id) { return document.getElementById(id); };
  var auth = null, threads = [], items = [], openMap = {}, timer = null;
  var cur = null;   // 보고 있는 대화: null=서버가 가장 최근 대화를 고름, ""=새 대화, 그 밖=대화 id
  try { auth = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  try { var saved = localStorage.getItem(TKEY); if (saved !== null) cur = saved; } catch (e) {}

  function errMsg(r) { return (r && ERR[r.error]) || (r && r.error) || ERR.network; }
  function api(body, ms) {
    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var t = ctl ? setTimeout(function () { ctl.abort(); }, ms || 25000) : 0;
    if (auth && auth.token) body.token = auth.token;
    return fetch(API, { method: "POST", body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .catch(function (e) { return { ok: false, error: e && e.name === "AbortError" ? "timeout" : "network" }; })
      .then(function (j) { clearTimeout(t); if (j && j.error === "bad_token") logout(); return j; });
  }
  function fmt(t) { if (!t) return ""; var d = new Date(t); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function cut(s, n) { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n) + "…" : s; }
  function setCur(t) { cur = t; try { localStorage.setItem(TKEY, t); } catch (e) {} }
  function show(loggedIn) {
    $("login").hidden = loggedIn; $("app").hidden = !loggedIn;
    var w = $("who");
    if (loggedIn) {
      w.hidden = false; w.textContent = "";
      var s = document.createElement("span"); s.textContent = auth.user.name + " · ";
      var b = document.createElement("button"); b.className = "link"; b.textContent = "나가기"; b.onclick = function () { api({ action: "logout" }); logout(); };
      w.appendChild(s); w.appendChild(b);
      load();
    } else { w.hidden = true; clearInterval(timer); timer = null; }
  }
  function logout() { auth = null; try { localStorage.removeItem(KEY); } catch (e) {} show(false); }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = $("loginMsg"); m.hidden = true; $("loginBtn").disabled = true;
    api({ action: "login", id: $("uid").value.trim(), pw: $("upw").value }).then(function (r) {
      $("loginBtn").disabled = false;
      if (!r.ok) { m.textContent = errMsg(r); m.hidden = false; return; }
      if (!r.user || r.user.role !== "admin") { m.textContent = ERR.forbidden; m.hidden = false; api({ action: "logout", token: r.token }); return; }
      auth = { token: r.token, user: r.user };
      try { localStorage.setItem(KEY, JSON.stringify(auth)); } catch (e2) {}
      $("upw").value = "";
      show(true);
    });
  });

  $("conv").addEventListener("change", function () { setCur(this.value); openMap = {}; $("sendMsg").hidden = true; load(); });
  $("newConv").addEventListener("click", function () { setCur(""); openMap = {}; $("sendMsg").hidden = true; load(); $("prompt").focus(); });
  $("prompt").addEventListener("input", function () { $("send").disabled = !$("prompt").value.trim(); });
  $("send").addEventListener("click", function () {
    var t = $("prompt").value.trim(); if (!t) return;
    var sm = $("sendMsg"); $("send").disabled = true; sm.hidden = true;
    var body = { action: "rcSubmit", prompt: t }; if (cur) body.thread = cur;
    api(body).then(function (r) {
      if (!r.ok) { sm.textContent = errMsg(r); sm.className = "msg bad"; sm.hidden = false; $("send").disabled = false; return; }
      if (r.thread) setCur(r.thread);
      $("prompt").value = ""; sm.textContent = "보냈습니다. PC가 받으면 '실행 중'으로 바뀝니다."; sm.className = "msg"; sm.hidden = false;
      load();
    });
  });

  function renderConv() {
    var sel = $("conv"); sel.textContent = "";
    function opt(v, label) { var o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); }
    if (!cur) opt("", "새 대화");
    threads.forEach(function (x) { opt(x.thread, cut(x.title, 28) + " · " + fmt(x.lastAt) + (x.active ? " · 실행 중" : "")); });
    sel.value = cur || "";
    var t = null; threads.forEach(function (x) { if (x.thread === cur) t = x; });
    $("title").textContent = t ? cut(t.title, 60) : "새 대화";
    $("sendHint").textContent = cur ? "이 대화에 이어서 보냅니다. Claude가 앞의 내용을 기억합니다." : "새 대화로 보냅니다.";
  }
  function render() {
    renderConv();
    var box = $("list"); box.textContent = "";
    if (!items.length) { var p = document.createElement("p"); p.className = "empty"; p.textContent = cur ? "아직 요청이 없습니다." : "아래에 첫 요청을 적어 보내세요."; box.appendChild(p); }
    items.forEach(function (x) {
      var el = document.createElement("article"); el.className = "item";
      var meta = document.createElement("div"); meta.className = "meta";
      var b = document.createElement("span"); b.className = "badge " + x.status; b.textContent = ST[x.status] || x.status;
      var tm = document.createElement("span"); tm.textContent = fmt(x.createdAt) + (x.sec ? " · " + x.sec + "초" : "");
      meta.appendChild(b); meta.appendChild(tm);
      var hasOut = !!(x.result || x.error);
      var isOpen = openMap[x.id] !== undefined ? openMap[x.id] : true;
      if (hasOut) {
        var tg = document.createElement("button"); tg.className = "link"; tg.style.marginLeft = "auto"; tg.textContent = isOpen ? "접기" : "결과 보기";
        tg.setAttribute("aria-expanded", String(isOpen));
        tg.onclick = function () { openMap[x.id] = !isOpen; render(); };
        meta.appendChild(tg);
      }
      var pr = document.createElement("div"); pr.className = "prompt"; pr.textContent = x.prompt;
      el.appendChild(meta); el.appendChild(pr);
      if (hasOut && isOpen) { var rs = document.createElement("div"); rs.className = "result" + (x.error ? " err" : ""); rs.textContent = x.result || x.error; el.appendChild(rs); }
      box.appendChild(el);
    });
    var active = threads.some(function (x) { return x.active; });
    if (active && !timer) timer = setInterval(load, 5000);
    if (!active && timer) { clearInterval(timer); timer = null; }
  }
  function load() {
    var body = { action: "rcList" }; if (cur !== null) body.thread = cur;
    api(body).then(function (r) {
      if (!r.ok) { if (auth) { var box = $("list"); box.textContent = ""; var p = document.createElement("p"); p.className = "msg bad"; p.textContent = errMsg(r); box.appendChild(p); } return; }
      threads = r.threads || []; items = r.items || [];
      if (typeof r.thread === "string") cur = r.thread;
      $("stale").hidden = !r.stale;
      render();
    });
  }
  show(!!(auth && auth.token && auth.user && auth.user.role === "admin"));
})();
</script>
</body>
</html>
